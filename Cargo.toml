[package]
name = "tree-table-core"
version = "0.1.0"
edition = "2024"
description = "A high performance core for a treeview table widget."
license = "Apache-2.0"
repository = "https://github.com/ragardner/tree-table-core"
keywords = ["table", "treeview", "tree", "widget", "rust"]
readme = "README.md"
rust-version = "1.90"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = { workspace = true }
chrono = { workspace = true }
bigdecimal = { workspace = true }
rust_decimal = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true, optional = true }
tsify = { version = "=0.5.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true, features = ["serde-serialize"] }

[features]
serde = ["dep:serde"]
tsify = ["serde", "dep:tsify", "dep:wasm-bindgen"]