[package]
name = "tree-table-core"
version = "0.1.0"
edition = "2024"
description = "A high performance core for a treeview table widget."
license = "Apache-2.0"
repository = "https://github.com/ragardner/tree-table-core"
keywords = ["table", "treeview", "tree", "widget", "rust"]
readme = "README.md"
rust-version = "1.90"

[dependencies]
deep-time = { path = "../deep-time", features = ["parse", "jiff-tz"] }
regex = "1"
jiff = "0.2"
bigdecimal = { version = "0.4.10" }
rust_decimal = { version = "1.40.0" }
num-bigint = { version = "0.4.6" }

serde = { version = "1.0", features = ["derive", "rc"], optional = true }
tsify = { version = "=0.5.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true, features = ["serde-serialize"] }

[features]
default = ["safety"]
safety = []

serde = [
    "dep:serde",
    "jiff/serde",
    "bigdecimal/serde",
    "bigdecimal/serde-json",
    "rust_decimal/serde",
    "num-bigint/serde",
    "deep-time/serde",
]

tsify = [
    "serde",
    "dep:tsify",
    "dep:wasm-bindgen",
    "deep-time/tsify",
    "jiff/js",
]

wasm = ["tsify"]