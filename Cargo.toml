[package]
name = "tree-table-core"
version = "0.1.0"
edition = "2024"
description = "A high performance core for a treeview table widget."
license = "Apache-2.0"
repository = "https://github.com/ragardner/tree-table-core"
keywords = ["table", "treeview", "tree", "widget", "rust"]
readme = "README.md"
rust-version = "1.90"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4.8", features = ["serde-json", "serde"] }
rust_decimal = { version = "1.38.0", features = ["serde"] }
num-bigint = { version = "0.4.6", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"], optional = true }
tsify = { version = "=0.5.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true, features = ["serde-serialize"] }

[features]
default = []
extra-safety = []
serde = ["dep:serde"]
tsify = ["serde", "dep:tsify", "dep:wasm-bindgen"]